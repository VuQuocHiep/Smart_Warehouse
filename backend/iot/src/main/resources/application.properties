spring.application.name=iot

spring.datasource.url=jdbc:mysql://localhost:3306/iot
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

iot.ingest-key=${IOT_INGEST_KEY:}
iot.gas.level1=${MQ2_GAS_LEVEL1:1800}
iot.gas.level2=${MQ2_GAS_LEVEL2:2500}
iot.gas.level3=${MQ2_GAS_LEVEL3:3200}
