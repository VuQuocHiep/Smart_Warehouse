spring.application.name=iot

spring.datasource.url=jdbc:mysql://localhost:3306/iot
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate: only validate entities against schema, let Flyway manage DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway: auto-run migration scripts in db/migration/ on startup
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true