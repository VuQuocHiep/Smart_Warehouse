spring.application.name=iot

spring.datasource.url=jdbc:mysql://localhost:3306/iot
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

iot.ingest-key=${IOT_INGEST_KEY:esp32-warehouse-01}
iot.gas.level1=${MQ2_GAS_LEVEL1:1800}
iot.gas.level2=${MQ2_GAS_LEVEL2:2500}
iot.gas.level3=${MQ2_GAS_LEVEL3:3200}

# Demand forecasting: DB history; weekly training at Monday 05:00 Asia/Ho_Chi_Minh.
demand.service.enabled=${DEMAND_SERVICE_ENABLED:false}
demand.service.url=${DEMAND_SERVICE_URL:http://127.0.0.1:8091}
demand.service.token=${DEMAND_SERVICE_TOKEN:}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}
server.forward-headers-strategy=framework
security.jwt.secret=${JWT_SECRET:}
app.cloud=${APP_CLOUD:false}
app.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:ADMINPTIT@gmail.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=16MB
demand.execution-mode=${DEMAND_EXECUTION_MODE:HTTP_WORKER}
demand.batch.token=${DEMAND_BATCH_TOKEN:}
demand.github.token=${DEMAND_GITHUB_TOKEN:}
demand.github.repository=${DEMAND_GITHUB_REPOSITORY:}
demand.github.ref=${DEMAND_GITHUB_REF:main}
demand.github.workflow=${DEMAND_GITHUB_WORKFLOW:demand-batch.yml}
