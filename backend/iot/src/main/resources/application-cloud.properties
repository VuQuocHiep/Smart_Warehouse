# The Render blueprint selects this profile. No cloud secret has a development fallback.
app.cloud=true
spring.jpa.show-sql=false
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.data.redis.repositories.enabled=false
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:defaultdb}?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/tmp/aiven-truststore.p12&trustCertificateKeyStorePassword=changeit&trustCertificateKeyStoreType=PKCS12&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
iot.ingest-key=${IOT_INGEST_KEY}
security.jwt.secret=${JWT_SECRET}
app.cors.origins=${CORS_ALLOWED_ORIGINS}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
demand.execution-mode=GITHUB_BATCH
demand.batch.token=${DEMAND_BATCH_TOKEN}
